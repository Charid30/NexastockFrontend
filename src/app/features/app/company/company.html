<div class="max-w-2xl">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">Profil de l'entreprise</h1>
    <p class="mt-1 text-sm text-gray-500">Informations générales de votre entreprise</p>
  </div>

  @if (loading()) {
    <div class="card animate-pulse h-64"></div>
  }

  @if (!loading()) {
    @if (success()) {
      <div class="mb-4 bg-green-50 border border-green-200 rounded-md p-3">
        <p class="text-sm text-green-700">Informations enregistrées avec succès.</p>
      </div>
    }

    @if (errors().length > 0) {
      <div class="mb-4 bg-red-50 border border-red-200 rounded-md p-3">
        @for (e of errors(); track e) { <p class="text-sm text-red-600">{{ e }}</p> }
      </div>
    }

    <div class="card">
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom commercial *</label>
          <input class="input" [(ngModel)]="form.name" placeholder="Ex : Mon Commerce" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Raison sociale</label>
          <input class="input" [(ngModel)]="form.legal_name" placeholder="Ex : MON COMMERCE SARL" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Numéro fiscal / IFU</label>
          <input class="input" [(ngModel)]="form.tax_number" placeholder="Ex : 1234567890123" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
          <input class="input" [(ngModel)]="form.address" placeholder="Adresse complète" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
            <input class="input" [(ngModel)]="form.phone" placeholder="+22900000000" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input class="input" type="email" [(ngModel)]="form.email" placeholder="contact@entreprise.com" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Site web</label>
          <input class="input" [(ngModel)]="form.website" placeholder="https://www.monentreprise.com" />
        </div>
      </div>

      @if (perm.can('entreprise', 'update')) {
        <div class="mt-6 flex justify-end">
          <button class="btn-primary" (click)="save()" [disabled]="saving()">
            {{ saving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
          </button>
        </div>
      }
    </div>
  }
</div>
