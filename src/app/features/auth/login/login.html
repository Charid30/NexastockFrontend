<div>

  <!-- En-tête -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">Connexion</h1>
    <div class="mt-2 h-0.5 w-10 bg-gray-900"></div>
    <p class="mt-3 text-sm text-gray-500">Accédez à votre espace NexaStock.</p>
  </div>

  @if (error()) {
    <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      <p class="font-medium">{{ error() }}</p>
      @if (errors().length) {
        <ul class="mt-1.5 list-disc pl-4 space-y-0.5">
          @for (e of errors(); track e) { <li>{{ e }}</li> }
        </ul>
      }
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

    <!-- Téléphone -->
    <div>
      <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-gray-500">
        Numéro de téléphone
      </label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
        </span>
        <input formControlName="phone" type="tel" placeholder="+226 00 00 00 00" class="input pl-9" />
      </div>
    </div>

    <!-- Mot de passe -->
    <div>
      <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-gray-500">
        Mot de passe
      </label>
      <div class="relative">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </span>
        <input formControlName="password" [type]="showPassword() ? 'text' : 'password'" placeholder="••••••••" class="input pl-9 pr-10" />
        <button type="button"
          class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors"
          (click)="showPassword.set(!showPassword())">
          @if (showPassword()) {
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
            </svg>
          } @else {
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Se souvenir / Mot de passe oublié -->
    <div class="flex items-center justify-between">
      <label class="flex cursor-pointer items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" class="h-4 w-4 rounded border-gray-300 accent-black" />
        Se souvenir de moi
      </label>
      <a href="#" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
        Mot de passe oublié ?
      </a>
    </div>

    <button type="submit" class="btn-primary w-full py-2.5 text-base" [disabled]="loading()">
      {{ loading() ? 'Connexion…' : 'Se connecter' }}
    </button>

  </form>

  <div class="my-6 flex items-center gap-4">
    <div class="h-px flex-1 bg-gray-200"></div>
    <span class="text-xs text-gray-400">ou</span>
    <div class="h-px flex-1 bg-gray-200"></div>
  </div>

  <p class="text-center text-sm text-gray-500">
    Pas encore de compte ?
    <a routerLink="/inscription" class="font-semibold text-gray-900 hover:underline">Inscrire mon entreprise</a>
  </p>

  <p class="mt-4 text-center">
    <a routerLink="/" class="text-sm text-gray-400 hover:text-gray-700 transition-colors">← Retour à l'accueil</a>
  </p>

</div>
