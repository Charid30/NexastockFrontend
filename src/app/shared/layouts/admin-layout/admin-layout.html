<div class="flex h-screen overflow-hidden bg-gray-50">

  <!-- Sidebar -->
  <aside class="flex w-60 shrink-0 flex-col border-r border-gray-200 bg-white">

    <!-- Logo -->
    <div class="flex h-14 items-center border-b border-gray-100 px-5">
      <a routerLink="/admin/dashboard" class="text-base font-bold tracking-tight text-gray-900">NexaStock</a>
      <span class="ml-2 rounded bg-gray-900 px-1.5 py-0.5 text-[10px] font-semibold text-white tracking-wide">ADMIN</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-3 py-4">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-gray-100 text-gray-900 font-medium"
          class="mb-0.5 flex items-center gap-3 rounded-md px-3 py-2 text-sm text-gray-500 transition-colors hover:bg-gray-50 hover:text-gray-900"
        >
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            @switch (item.icon) {
              @case ('dashboard') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
              }
              @case ('organisations') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
              }
              @case ('agents') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
              }
              @case ('utilisateurs') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              }
              @case ('permissions') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              }
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Profil utilisateur -->
    <div class="border-t border-gray-100 p-3">
      <div class="flex items-center gap-3 rounded-md px-3 py-2">
        <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-gray-900 text-xs font-semibold text-white">
          {{ user()?.first_name?.charAt(0) }}{{ user()?.last_name?.charAt(0) }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-gray-900">{{ user()?.first_name }} {{ user()?.last_name }}</p>
          <p class="truncate text-xs text-gray-400">Super Admin</p>
        </div>
      </div>
      <button (click)="auth.logout()" class="mt-1 w-full rounded-md px-3 py-2 text-left text-sm text-gray-400 transition-colors hover:bg-gray-50 hover:text-gray-700">
        Déconnexion
      </button>
    </div>

  </aside>

  <!-- Contenu principal -->
  <div class="flex flex-1 flex-col overflow-hidden">

    <!-- Topbar -->
    <header class="flex h-14 shrink-0 items-center border-b border-gray-200 bg-white px-6">
      <span class="text-sm text-gray-400">Panneau d'administration</span>
    </header>

    <!-- Page -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>

  </div>

</div>
